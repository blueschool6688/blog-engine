
networks:
  backend_net:
    driver: bridge

services:

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/migrate"]
    env_file: .env
    networks:
      - backend_net
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/cms"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend_net
    ports:
      - "8080:8080"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/worker"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://api:8080/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VITE_API_BASE_URL: http://api:8080/api
    depends_on:
      api:
        condition: service_started
    networks:
      - backend_net
    ports:
      - "3000:3000"

volumes:
  uploads:
