# ════════════════════════════════════════════════════════════════
# Blog Engine — Docker Compose Production Overrides
#
# Cách dùng:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.docker up -d --build
#
# Trước khi deploy, thay "yourdomain.com" bằng domain thật:
#   1. VITE_API_BASE_URL bên dưới
#   2. nginx/nginx.conf → server_name
#   3. APP_URL trong .env.docker
# ════════════════════════════════════════════════════════════════

services:

  api:
    ports: []                    # Ẩn sau Nginx, không expose ra host
    restart: always
    env_file: .env.docker
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  worker:
    restart: always
    env_file: .env.docker
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  migrate:
    env_file: .env.docker

  web:
    ports: []                    # Ẩn sau Nginx, không expose ra host
    restart: always
    build:
      args:
        VITE_API_BASE_URL: https://yourdomain.com/api
    environment:
      VITE_API_BASE_URL: https://yourdomain.com/api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Nginx Reverse Proxy ────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads:/app/uploads:ro
    depends_on:
      - api
      - web
    networks:
      - backend_net
